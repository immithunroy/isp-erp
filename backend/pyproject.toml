[project]
name = "isp-erp-backend"
version = "0.1.0"
description = "ISP Operations ERP backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1.19",
    "geoalchemy2>=0.15",
    "redis>=5.0",
    "passlib[argon2,bcrypt]>=1.7.4",
    "bcrypt>=4.1,<4.2",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "structlog>=24.1",
    "anyio>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # FastAPI defaults in function signatures

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"alembic/env.py" = ["E402"]
"app/models/hrm.py" = ["E501"]
"app/api/v1/hrm.py" = ["E501"]
"app/services/hrm_service.py" = ["E501"]
"app/services/mobile_service.py" = ["E501"]
"app/api/v1/mobile.py" = ["E501"]
"app/schemas/mobile.py" = ["E501"]
"app/models/mobile.py" = ["E501"]
"app/schemas/hrm.py" = ["E501"]
"app/schemas/customers.py" = ["E501"]
"app/services/customer_service.py" = ["E501"]
"app/api/v1/customers.py" = ["E501"]
"app/models/customers.py" = ["E501"]
"tests/test_hrm.py" = ["E501", "F841"]
"tests/test_customers.py" = ["E501", "F841"]
"app/schemas/network.py" = ["E501"]
"app/services/network_service.py" = ["E501"]
"app/api/v1/network.py" = ["E501"]
"app/models/network.py" = ["E501"]
"tests/test_network.py" = ["E501", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["return-value", "arg-type", "union-attr", "assignment", "attr-defined"]