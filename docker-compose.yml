name: isp-erp

services:
  db:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isp_erp}
      POSTGRES_USER: ${POSTGRES_USER:-isp_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - isp_erp_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isp_erp} -d ${POSTGRES_DB:-isp_erp}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [isp_erp]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - isp_erp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [isp_erp]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/live').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [isp_erp]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8040:80"
    restart: unless-stopped
    networks: [isp_erp]

networks:
  isp_erp:
    driver: bridge

volumes:
  isp_erp_db_data:
  isp_erp_redis_data: